alerts:
  - name: HighLatencyP95
    severity: Critical
    condition: p95_latency > 3000ms for 5m
    type: symptom-based
    owner: SRE & Alerts Engineer (Role D)
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: Critical
    condition: error_rate_pct > 2% for 3m
    type: symptom-based
    owner: SRE & Alerts Engineer (Role D)
    runbook: docs/alerts.md#alert-2
  - name: CostLimitExceeded
    severity: Warning
    condition: total_cost_usd > 2.5 in 1h
    type: symptom-based
    owner: SRE & Alerts Engineer (Role D)
    runbook: docs/alerts.md#alert-3

